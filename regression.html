<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Fieldnotes executable regressions</title><h1>Fieldnotes executable regressions</h1><p>Runs the real app in a same-origin iframe using only <code>fieldnotes.regression.test.v1</code>. Timeout/assertion is failure.</p><pre id="results" role="status" aria-live="polite">RUNNING…</pre><iframe id="app" title="Isolated Fieldnotes app" src="index.html?storage=regression" hidden></iframe><script>
(async()=>{const out=document.querySelector('#results'),f=document.querySelector('#app');let passed=0,failed=0;out.textContent='RUNNING executable regressions\n';const line=s=>out.textContent+=s+'\n';const assert=(v,m)=>{if(!v)throw Error(m)};let w,d,key='fieldnotes.regression.test.v1',originalSet;
const wait=ms=>new Promise(r=>setTimeout(r,ms)), load=()=>new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(Error('iframe load timeout')),5000);f.onload=()=>{clearTimeout(t);resolve()};f.src='index.html?storage=regression&run='+Math.random()});
const reset=async()=>{restore();w.localStorage.setItem(key,JSON.stringify({projects:[{id:'p1',name:'Project'}],notes:[{id:'n1',project:'p1',name:'Note',content:'seed'}],preferences:{view:'split',vim:false}}));await load();w=f.contentWindow;d=f.contentDocument;originalSet=w.Storage.prototype.setItem;assert(w.location.origin===location.origin,'not same-origin');assert(w.FieldnotesEditor?.isReady(),'CodeMirror editor unavailable')};const $=s=>d.querySelector(s),click=s=>$(s).click(),cm=()=>w.FieldnotesEditor.getCodeMirror(),edit=value=>cm().setValue(value),restore=()=>{if(w&&originalSet)Object.defineProperty(w.Storage.prototype,'setItem',{value:originalSet,configurable:true,writable:true})};
try{await new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(Error('iframe initial load timeout')),5000);f.onload=()=>{clearTimeout(t);resolve()}});w=f.contentWindow;d=f.contentDocument;originalSet=w.Storage.prototype.setItem;const cases=[
['storage exception, retained draft, recovery',async()=>{await reset();click('#tree .note');let ed=$('#editor');edit('retained draft');Object.defineProperty(w.Storage.prototype,'setItem',{configurable:true,writable:true,value:function(k,v){if(k===key)throw Error('injected failure');return originalSet.call(this,k,v)}});await wait(350);assert(w.FieldnotesEditor.getValue()==='retained draft','draft lost');assert($('#status').textContent.includes('failed'),'failure not reported');assert(JSON.parse(w.localStorage.getItem(key)).notes[0].content==='seed','failed state committed');restore();ed.dispatchEvent(new w.Event('input',{bubbles:true}));await wait(350);assert(JSON.parse(w.localStorage.getItem(key)).notes[0].content==='retained draft','recovery failed')}],
['CRUD cancellation',async()=>{await reset();w.confirm=()=>false;click('#tree .note');click('#delete');assert(JSON.parse(w.localStorage.getItem(key)).notes.length===1,'cancel changed data')}],
['reload persistence',async()=>{await reset();click('#tree .note');edit('persist');await wait(350);const value=w.localStorage.getItem(key);await load();w=f.contentWindow;d=f.contentDocument;assert(w.localStorage.getItem(key)===value,'state changed on reload');assert($('#tree').textContent.includes('Project'),'project absent')}],
['preferences and view/live-preview wiring',async()=>{await reset();click('#tree .note');click('[data-view="preview"]');assert($('#panes').classList.contains('view-preview'),'view class absent');edit('**live**');assert($('#preview strong')?.textContent==='live','live preview absent');click('#vimToggle');assert($('#vimToggle').checked,'toggle failed')}],
['Markdown import/export fidelity',async()=>{await reset();click('#tree .note');let text='# Exact\r\n\r\nline',file=new w.File([text],'fidelity.md',{type:'text/markdown'});Object.defineProperty($('#file'),'files',{configurable:true,value:[file]});$('#file').dispatchEvent(new w.Event('change'));await wait(50);assert(JSON.parse(w.localStorage.getItem(key)).notes[0].content===text,'import altered content');assert(typeof w.Blob==='function','export Blob API missing');click('#export')}],
['CodeMirror Vim append and cursor modes',async()=>{await reset();click('#tree .note');const instance=cm();instance.setValue('abc\ndef');instance.setCursor({line:0,ch:0});click('#vimToggle');instance.focus();await wait(20);assert(instance.getWrapperElement().classList.contains('cm-fat-cursor'),'Normal mode has no block cursor');assert($('#editorModeBadge').textContent==='NORMAL','Normal mode badge absent');w.CodeMirror.Vim.handleKey(instance,'a');assert($('#editorModeBadge').textContent==='INSERT','a did not enter Insert mode (badge='+$('#editorModeBadge').textContent+', insert='+instance.state.vim?.insertMode+')');assert(!instance.getWrapperElement().classList.contains('cm-fat-cursor'),'Insert mode retained block cursor');instance.replaceSelection('X','end');w.CodeMirror.Vim.handleKey(instance,'<Esc>');assert(instance.getValue()==='aXbc\ndef','a did not append after the cursor');assert($('#editorModeBadge').textContent==='NORMAL','Escape did not return to Normal mode');assert(instance.getWrapperElement().classList.contains('cm-fat-cursor'),'Normal block cursor was not restored')}]];
cases.push(['Vim keyboard routing, visual mode, undo and toggle',async()=>{
  await reset();click('#tree .note');const instance=cm();
  edit('abc\ndef');instance.setCursor(0,0);click('#vimToggle');instance.focus();
  const press=(key,code)=>{
    const input=instance.getInputField();
    const unhandled=input.dispatchEvent(new w.KeyboardEvent('keydown',{key,keyCode:code,which:code,bubbles:true,cancelable:true}));
    if(unhandled && key.length===1) input.dispatchEvent(new w.KeyboardEvent('keypress',{key,charCode:key.charCodeAt(0),keyCode:key.charCodeAt(0),which:key.charCodeAt(0),bubbles:true,cancelable:true}));
  };
  press('a',65);
  assert(instance.state.vim.insertMode,'a keydown did not reach Vim');
  instance.replaceSelection('X','end','+input');
  press('Escape',27);
  assert(instance.getValue()==='aXbc\ndef','append keyboard flow failed');
  assert($('#editorModeBadge').textContent==='NORMAL','Escape badge failed');
  press('v',86);
  assert($('#editorModeBadge').textContent==='VISUAL','Visual badge failed');
  press('Escape',27);
  press('x',88);
  assert(instance.getValue()==='abc\ndef','x failed');
  press('u',85);
  assert(instance.getValue()==='aXbc\ndef','undo failed');
  press('i',73);click('#vimToggle');
  assert(instance.getOption('keyMap')==='default','toggle off failed');
  assert(!instance.getWrapperElement().classList.contains('cm-fat-cursor'),'plain editing has block cursor');
  assert($('#editorModeBadge').textContent==='PLAIN','plain badge failed');
  click('#vimToggle');
  assert($('#editorModeBadge').textContent==='NORMAL','toggle on failed');
  w.FieldnotesEditor.setValue('another note');press('u',85);
  assert(instance.getValue()==='another note','undo leaked across notes');
}]);
cases.push(['LaTeX rendering',async()=>{
  await reset();click('#tree .note');
  edit('Inline $E=mc^2$ and **bold**.\n\n$$\n\\frac{a_1}{b_2}\n$$\n\n'+
    '\x60$literal$\x60\n\n\x60\x60\x60tex\n$code$\n\x60\x60\x60');
  assert($('#preview .katex'),'inline math absent');
  assert($('#preview .katex-display'),'multiline display math absent');
  assert($('#preview strong')?.textContent==='bold','Markdown broken');
  assert($('#preview pre code').textContent==='$code$','fenced math rendered');
  assert([...d.querySelectorAll('#preview code')].some(el=>el.textContent==='$literal$'),'inline code rendered');
  assert(!$('#preview code .katex'),'math inside code');
  assert(cm().getValue().includes('\\frac{a_1}{b_2}'),'source modified');
  edit('$\\frac{a$');
  assert($('#preview .katex-error'),'invalid TeX error absent');
  edit('$\\href{javascript:alert(1)}{bad}$ <img src=x onerror=alert(1)>');
  assert(!$('#preview img')&&!$('#preview a[href^="javascript:"]'),'unsafe markup rendered');
}]);
for(const [name,fn] of cases){try{await fn();passed++;line('PASS '+name)}catch(e){failed++;line('FAIL '+name+': '+(e.stack||e))}finally{restore()}}}catch(e){failed++;line('FAIL harness setup: '+(e.stack||e))}restore();out.textContent+='\nRESULT '+(failed?'FAIL':'PASS')+' — '+passed+' passed, '+failed+' failed';out.dataset.result=failed?'fail':'pass'})();
</script></html>
