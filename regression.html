<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Fieldnotes executable regressions</title><h1>Fieldnotes executable regressions</h1><p>Runs the real app in a same-origin iframe using only <code>fieldnotes.regression.test.v1</code>. Timeout/assertion is failure.</p><pre id="results" role="status" aria-live="polite">RUNNING…</pre><iframe id="app" title="Isolated Fieldnotes app" src="index.html?storage=regression" hidden></iframe><script>
(async()=>{const out=document.querySelector('#results'),f=document.querySelector('#app');let passed=0,failed=0;out.textContent='RUNNING executable regressions\n';const line=s=>out.textContent+=s+'\n';const assert=(v,m)=>{if(!v)throw Error(m)};let w,d,key='fieldnotes.regression.test.v1',originalSet;
const wait=ms=>new Promise(r=>setTimeout(r,ms)), load=()=>new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(Error('iframe load timeout')),5000);f.onload=()=>{clearTimeout(t);resolve()};f.src='index.html?storage=regression&run='+Math.random()});
const reset=async()=>{restore();w.localStorage.setItem(key,JSON.stringify({projects:[{id:'p1',name:'Project'}],notes:[{id:'n1',project:'p1',name:'Note',content:'seed'}]}));await load();w=f.contentWindow;d=f.contentDocument;originalSet=w.Storage.prototype.setItem;assert(w.location.origin===location.origin,'not same-origin')};const $=s=>d.querySelector(s),click=s=>$(s).click(),restore=()=>{if(w&&originalSet)Object.defineProperty(w.Storage.prototype,'setItem',{value:originalSet,configurable:true,writable:true})};
try{await new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(Error('iframe initial load timeout')),5000);f.onload=()=>{clearTimeout(t);resolve()}});w=f.contentWindow;d=f.contentDocument;originalSet=w.Storage.prototype.setItem;const cases=[
['storage exception, retained draft, recovery',async()=>{await reset();click('#tree button');let ed=$('#editor');ed.value='retained draft';ed.dispatchEvent(new w.Event('input',{bubbles:true}));Object.defineProperty(w.Storage.prototype,'setItem',{configurable:true,writable:true,value:function(k,v){if(k===key)throw Error('injected failure');return originalSet.call(this,k,v)}});await wait(350);assert(ed.value==='retained draft','draft lost');assert($('#status').textContent.includes('failed'),'failure not reported');assert(JSON.parse(w.localStorage.getItem(key)).notes[0].content==='seed','failed state committed');restore();ed.dispatchEvent(new w.Event('input',{bubbles:true}));await wait(350);assert(JSON.parse(w.localStorage.getItem(key)).notes[0].content==='retained draft','recovery failed')}],
['CRUD cancellation',async()=>{await reset();w.confirm=()=>false;click('#tree button');click('#delete');assert(JSON.parse(w.localStorage.getItem(key)).notes.length===1,'cancel changed data')}],
['reload persistence',async()=>{await reset();click('#tree button');let ed=$('#editor');ed.value='persist';ed.dispatchEvent(new w.Event('input',{bubbles:true}));await wait(350);const value=w.localStorage.getItem(key);await load();w=f.contentWindow;d=f.contentDocument;assert(w.localStorage.getItem(key)===value,'state changed on reload');assert($('#tree').textContent.includes('Project'),'project absent')}],
['preferences and view/live-preview wiring',async()=>{await reset();click('#tree button');click('[data-view="preview"]');assert($('#panes').classList.contains('view-preview'),'view class absent');let ed=$('#editor');ed.value='**live**';ed.dispatchEvent(new w.Event('input',{bubbles:true}));assert($('#preview strong')?.textContent==='live','live preview absent');click('#vimToggle');assert($('#vimToggle').checked,'toggle failed')}],
['Markdown import/export fidelity',async()=>{await reset();click('#tree button');let text='# Exact\r\n\r\nline',file=new w.File([text],'fidelity.md',{type:'text/markdown'});Object.defineProperty($('#file'),'files',{configurable:true,value:[file]});$('#file').dispatchEvent(new w.Event('change'));await wait(50);assert(JSON.parse(w.localStorage.getItem(key)).notes[0].content===text,'import altered content');assert(typeof w.Blob==='function','export Blob API missing');click('#export')}],
['Vim transitions, boundary edits, Ctrl-d preservation',async()=>{await reset();click('#tree button');let ed=$('#editor');ed.value='abc';click('#vimToggle');ed.focus();ed.setSelectionRange(0,0);ed.dispatchEvent(new w.KeyboardEvent('keydown',{key:'h',bubbles:true,cancelable:true}));assert(ed.selectionStart===0,'boundary crossed');ed.dispatchEvent(new w.KeyboardEvent('keydown',{key:'i',bubbles:true,cancelable:true}));assert($('#status').textContent.includes('INSERT'),'insert transition absent');ed.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));ed.dispatchEvent(new w.KeyboardEvent('keydown',{key:'d',ctrlKey:true,bubbles:true,cancelable:true}));assert(ed.value==='abc','Ctrl-d changed content')}]];
for(const [name,fn] of cases){try{await fn();passed++;line('PASS '+name)}catch(e){failed++;line('FAIL '+name+': '+(e.stack||e))}finally{restore()}}}catch(e){failed++;line('FAIL harness setup: '+(e.stack||e))}restore();out.textContent+='\nRESULT '+(failed?'FAIL':'PASS')+' — '+passed+' passed, '+failed+' failed';out.dataset.result=failed?'fail':'pass'})();
</script></html>
