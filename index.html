<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Fieldnotes</title><link rel="stylesheet" href="vendor/codemirror/codemirror.min.css"><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="#">fieldnotes</a><label class="vim"><input id="vimToggle" type="checkbox"> Vim mode</label><button id="newProject">+ Project</button><button id="newNote">+ Note</button><button id="renameProject">Rename project</button><button id="deleteProject">Delete project</button><button id="rename">Rename</button><button id="delete">Delete</button><span id="status" role="status" aria-live="polite"></span></header>
